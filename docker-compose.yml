version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - TWILIO_ACCOUNT_SID=your_twilio_sid
      - TWILIO_AUTH_TOKEN=your_twilio_token
      - OPENAI_API_KEY=your_openai_key
      - DATABASE_URI=postgresql://user:password@db:5432/ai_phone_agent
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_phone_agent
    ports:
      - "5432:5432"
